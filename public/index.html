<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FC8019">
<title>Swiggy — live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FC8019'/%3E%3Cpath d='M9 9h14l-1.4 6H10.4L9 9zm1.6 8h10.8L20 25h-8l-1.4-8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="statusbar">
        <span id="clock">--:--</span>
        <span class="sb-right">
          <svg viewBox="0 0 24 16" width="18" height="12" fill="currentColor"><rect x="0" y="10" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="9" rx="1"/><rect x="10" y="4" width="3" height="12" rx="1"/><rect x="15" y="1" width="3" height="15" rx="1" opacity=".35"/></svg>
          <svg viewBox="0 0 24 16" width="16" height="12" fill="currentColor"><path d="M12 3.2c3 0 5.8 1.1 7.9 3l1.4-1.5A14 14 0 0012 1 14 14 0 002.7 4.7L4.1 6.2A11.6 11.6 0 0112 3.2z"/><path d="M12 7.6c1.9 0 3.6.7 4.9 1.9l1.4-1.5A9.1 9.1 0 0012 5.4a9.1 9.1 0 00-6.3 2.6l1.4 1.5A7 7 0 0112 7.6z"/><circle cx="12" cy="13" r="2"/></svg>
          <svg viewBox="0 0 26 14" width="22" height="12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x=".7" y=".7" width="20" height="12.6" rx="3"/><rect x="3" y="3" width="14" height="8" rx="1.6" fill="currentColor" stroke="none"/><path d="M23 4.6v4.8" stroke-linecap="round"/></svg>
        </span>
      </div>

      <main id="app" class="app" aria-live="polite"></main>
      <div id="cartpill" class="cartpill"></div>
      <nav id="nav" class="tabbar"></nav>
      <div class="gesture"></div>

      <div id="sheet" class="sheet-wrap"></div>
      <div id="toast" class="toast"></div>
      <span id="netdot" class="netdot"></span>
    </div>
  </div>

  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script>
    (function boot() {
      const tick = () => {
        const el = document.getElementById('clock');
        if (!el) return;
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true,
        }).format(new Date()).split(' ');
        el.textContent = parts[0];
      };
      tick();
      setInterval(tick, 20000);
      Core.render();
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { Core.closeSheet(); }
      });
    })();
  </script>
</body>
</html>
